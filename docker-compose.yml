services:
  db:
    image: postgres:16-alpine
    container_name: auto_repair_db
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: auto_repair_api_development
    ports:
      - "5432:5432"

  api:
    build:
      context: .
      dockerfile: Dockerfile.development
    container_name: auto_repair_api
    depends_on:
      - db
    environment:
      RAILS_ENV: development
      JWT_SECRET: dev_secret_change_in_production
    volumes:
      - .:/rails
      - bundle_data:/usr/local/bundle
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  bundle_data: