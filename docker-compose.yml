services:
  db:
    image: postgres:16-alpine
    container_name: auto_repair_db
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: auto_repair_api_development
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:v1.24
    container_name: auto_repair_mailpit
    restart: always
    ports:
      - "1025:1025"
      - "8025:8025"

  api:
    build:
      context: .
      dockerfile: Dockerfile.development
    container_name: auto_repair_api
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      RAILS_ENV: development
      JWT_SECRET: dev_secret_change_in_production
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
    volumes:
      - .:/rails
      - bundle_data:/usr/local/bundle
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  bundle_data:
