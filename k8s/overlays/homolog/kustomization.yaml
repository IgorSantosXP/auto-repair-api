apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: auto-repair-homolog

resources:
  - ../../base
  - namespace.yaml

configMapGenerator:
  - name: api-config
    literals:
      - RAILS_ENV=production
      - RAILS_LOG_TO_STDOUT=true
      - RAILS_SERVE_STATIC_FILES=true
      - DD_ENV=homolog
      - DD_SERVICE=auto-repair-api
      - SMTP_HOST=mailpit.auto-repair-homolog.svc.cluster.local
      - SMTP_PORT=1025
      - SERVICE_NAME=os-service
      - AWS_REGION=us-east-1
      - EVENTS_TOPIC_ARN=arn:aws:sns:us-east-1:814623398856:auto-repair-homolog-events
      - QUEUE_URL=https://sqs.us-east-1.amazonaws.com/814623398856/auto-repair-homolog-os
      - EXECUTION_SERVICE_URL=http://api.auto-repair-execution-homolog.svc.cluster.local

patches:
  - path: replicas.yaml

images:
  - name: auto-repair-api
    newName: 814623398856.dkr.ecr.us-east-1.amazonaws.com/auto-repair-api
    newTag: latest
