# Saga worker: relays the transactional outbox to SNS and consumes the replies
# from Billing and Execution on the OS SQS queue.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  labels:
    app: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
        tags.datadoghq.com/service: auto-repair-api
      annotations:
        ad.datadoghq.com/worker.logs: '[{"source":"ruby","service":"auto-repair-api"}]'
    spec:
      serviceAccountName: os-service
      terminationGracePeriodSeconds: 30
      containers:
        - name: worker
          image: auto-repair-api
          imagePullPolicy: Always
          command: ["bin/rails", "messaging:work"]
          env:
            - name: DD_AGENT_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: DD_SERVICE
              value: auto-repair-api
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          envFrom:
            - configMapRef:
                name: api-config
            - secretRef:
                name: api-secrets
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 250m
              memory: 512Mi
